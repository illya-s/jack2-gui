name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            upload: true
          - os: ubuntu-latest
            upload: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install JACK2 (macOS)
        if: runner.os == 'macOS'
        run: brew install jack pkgconf

      - name: Install JACK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjack-dev pkg-config

      - name: Build
        run: cargo build --release --locked

      - name: Upload macOS binary
        if: matrix.upload
        uses: actions/upload-artifact@v4
        with:
          name: jack2-gui-macos
          path: target/release/jack2-gui
          if-no-files-found: error
