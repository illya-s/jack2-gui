name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    name: build and release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install JACK2
        run: brew install jack pkgconf

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${VERSION}-${SHORT_SHA}"
          ASSET="jack2-gui-macos"
          mkdir -p dist
          cp target/release/jack2-gui "dist/${ASSET}"
          chmod +x "dist/${ASSET}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=v${VERSION} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          echo "asset=dist/${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.name }}
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.package.outputs.asset }}
